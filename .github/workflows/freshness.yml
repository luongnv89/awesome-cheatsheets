name: freshness

# Weekly freshness cron — resolves issue #26 (Task 4.7, PRD §3 M6 / §7).
#
# Responsibilities:
#   1. Run every Monday 09:00 UTC (and on demand via workflow_dispatch).
#   2. Scan every cheatsheet under `src/content/cheatsheets/` and compute
#      staleness via the shared `tools/utils/freshness.ts#isStale` predicate
#      (one source of truth, also used by the catalog and the cheatsheet
#      detail layout — see PR #44).
#   3. For each stale entry, open a single GitHub issue labelled
#      `needs-update` that names the slug and links the source file.
#
# Idempotency:
#   `tools/ci/freshness-scan.ts` searches open issues with label
#   `needs-update` and the slug in the title before filing. A second run
#   with no new stale items creates zero new issues. Closing an existing
#   `needs-update` issue (after the cheatsheet is refreshed) re-enables
#   filing on the next cron tick if the item is still stale.
#
# Manual / dry-run:
#   Trigger via the "Run workflow" button in the Actions UI. Setting the
#   `dry_run` input to `true` runs the scanner with `--dry-run`, which
#   prints the intent without creating issues — useful for verifying the
#   logic against the live content without spamming the tracker.
#
# Permissions:
#   `issues: write` to create issues and ensure the label exists.
#   `contents: read` to check out the cheatsheets directory.
#   No other scopes are requested — the default `GITHUB_TOKEN` cannot
#   modify workflows, secrets, or any other repo settings.

on:
  schedule:
    # Mondays at 09:00 UTC. Cron syntax: minute hour day month day-of-week.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no issues created)"
        type: boolean
        required: false
        default: false

# Cron + manual triggers on the same workflow should not stomp each other.
concurrency:
  group: freshness-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  freshness:
    name: scan cheatsheets and file needs-update issues
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node so its `cache: pnpm` step can
      # discover the lockfile. Version is auto-detected from the
      # `packageManager` field in package.json (pnpm@10.28.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run freshness scan
        # GITHUB_TOKEN is provided automatically by Actions and is scoped by
        # the `permissions` block above (issues:write, contents:read).
        # GITHUB_REPOSITORY is also provided automatically (e.g. owner/repo).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm freshness:scan -- --dry-run
          else
            pnpm freshness:scan
          fi
