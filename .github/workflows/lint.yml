name: lint

# CI gate for the cheatsheet toolchain (Task 1.4 / issue #4).
#
# Two responsibilities:
#   1. Run `pnpm cheatsheet:lint` against the Hermes contract-anchor fixture
#      so any drift in the validator, rules, or contract that breaks Hermes
#      blocks the PR.
#   2. Run the full vitest suite (validator + CLI + the Hermes regression
#      snapshot in tools/validator/__tests__/hermes-regression.test.ts).
#
# The smoke lint uses `--no-links` to keep CI offline and deterministic. The
# external-link rule itself is exercised by validator unit tests with a
# mocked fetch — see tools/validator/__tests__/links.test.ts.

on:
  pull_request:
    paths:
      - ".claude/skills/cheatsheet-scribe/**"
      - "tools/**"
      - "scribe-fixtures/**"
      - "src/content/cheatsheets/hermes-agent/**"
  push:
    branches: [main]
    paths:
      - ".claude/skills/cheatsheet-scribe/**"
      - "tools/**"
      - "scribe-fixtures/**"
      - "src/content/cheatsheets/hermes-agent/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node so its `cache: pnpm` step can
      # discover the lockfile. Version is auto-detected from the
      # `packageManager` field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Hermes contract-anchor fixture
        run: pnpm cheatsheet:lint src/content/cheatsheets/hermes-agent/hermes-agent.md --no-links

      - name: Run test suite
        run: pnpm test
